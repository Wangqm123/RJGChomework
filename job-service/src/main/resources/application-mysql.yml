# MySQL 配置（可选切换）：启动时加参数
#   java -jar job-service.jar --spring.profiles.active=mysql
#   或 mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#
# 前置条件：先在本机 MySQL 里建好库
#   CREATE DATABASE campus_job DEFAULT CHARACTER SET utf8mb4;
# schema.sql / data.sql 会在启动时自动执行（幂等，可重复启动）
#
# ⚠ 注意：schema.sql 是通用语法，可直接用于 MySQL；
#   但 data.sql 用的是 H2 的 MERGE INTO ... KEY(id) 语法，MySQL 不支持，
#   切换 MySQL 前必须先把 data.sql 改写为 INSERT ... ON DUPLICATE KEY UPDATE，
#   或用 spring.sql.init.data-locations 指向单独的 MySQL 种子脚本，否则启动会报语法错误。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_job?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "改成你的MySQL密码"
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

  # H2 控制台在 MySQL 模式下无意义，关闭
  h2:
    console:
      enabled: false
