# 工时考勤与补贴核算服务配置（默认：H2 文件数据库，开箱即用）
server:
  port: 8083   # 约定：auth=8081，job=8082，attendance=8083，避免端口冲突

spring:
  datasource:
    # H2 文件数据库：零安装，启动即用；数据落在 ./data/attendancedb.mv.db
    # 注意：与权限服务、岗位服务是不同的库（分布式服务各自独立数据库）
    url: jdbc:h2:file:./data/attendancedb;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none        # 表结构由 schema.sql 管理，不自动改表
    open-in-view: false
    show-sql: true          # 控制台打印 SQL，方便调试
  sql:
    init:
      mode: always          # 每次启动执行 schema.sql（IF NOT EXISTS）+ data.sql（幂等）
  h2:
    console:
      enabled: true         # 浏览器访问 http://localhost:8083/h2-console 可查看数据
      path: /h2-console

# 依赖服务的地址（跨服务调用）
auth:
  service:
    base-url: http://localhost:8081   # 权限服务：校验 Token、查用户部门/姓名
job:
  service:
    base-url: http://localhost:8082   # 岗位服务：查询录用资格、岗位时薪与所属部门

logging:
  level:
    com.campus.attendance: info
