# MySQL 配置（可选切换）：启动时加参数
#   java -jar attendance-service.jar --spring.profiles.active=mysql
#   或 mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#
# 前置条件：先在本机 MySQL 里建好库
#   CREATE DATABASE campus_attendance DEFAULT CHARACTER SET utf8mb4;
#
# ⚠ 切库前必看（与 job-service 的差异）：
#   1. data.sql 本服务没有业务数据（只有一条 SELECT 1 占位），MySQL 可直接执行，无需改写 MERGE 语法；
#   2. schema.sql 里的三行 `CREATE INDEX IF NOT EXISTS` 是 H2/PostgreSQL 语法，MySQL 不支持，
#      切库前请先注释掉，建库后手工执行：
#        ALTER TABLE t_attendance_record ADD INDEX idx_att_user_time (user_id, check_in_time);
#        ALTER TABLE t_attendance_record ADD INDEX idx_att_dept_time (dept_id, check_in_time);
#        ALTER TABLE t_attendance_record ADD INDEX idx_att_status (status);
#   3. 并发防线 uk_att_active 唯一约束写在建表语句内，MySQL 直接支持，不需要额外处理。
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_attendance?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "改成你的MySQL密码"
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

  # H2 控制台在 MySQL 模式下无意义，关闭
  h2:
    console:
      enabled: false
