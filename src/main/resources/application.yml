# 用户权限服务配置（默认：H2 文件数据库，开箱即用）
server:
  port: 8081   # 约定：auth=8081，job=8082，attendance=8083，避免端口冲突

spring:
  datasource:
    # H2 文件数据库：零安装，启动即用；数据落在 ./data/authdb.mv.db
    url: jdbc:h2:file:./data/authdb;MODE=MySQL;AUTO_SERVER=TRUE
    driver-class-name: org.h2.Driver
    username: sa
    password: ""
  jpa:
    hibernate:
      ddl-auto: none        # 表结构由 schema.sql 管理，不自动改表
    open-in-view: false
    show-sql: true          # 控制台打印 SQL，方便调试
  sql:
    init:
      mode: always          # 每次启动执行 schema.sql（IF NOT EXISTS）+ data.sql（幂等）
  h2:
    console:
      enabled: true         # 浏览器访问 http://localhost:8081/h2-console 可查看数据
      path: /h2-console

# JWT 签发与校验配置
auth:
  jwt:
    # 签名密钥（HS256 要求至少 32 字节）。
    # 注意：全组三个服务若要本地验签必须用同一密钥；切勿提交到公开仓库时可改用环境变量注入
    secret: "campus-workstudy-jwt-secret-key-2026-change-me-in-production"
    ttl-hours: 24          # Token 有效期（小时）

logging:
  level:
    com.campus.auth: info
