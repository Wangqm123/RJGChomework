# MySQL 配置（可选切换）：启动时加参数
#   java -jar auth-service.jar --spring.profiles.active=mysql
#   或 VS Code 运行配置 / mvn spring-boot:run -Dspring-boot.run.profiles=mysql
#
# 前置条件：先在本机 MySQL 里建好库
#   CREATE DATABASE campus_auth DEFAULT CHARACTER SET utf8mb4;
# schema.sql / data.sql 会在启动时自动执行（幂等，可重复启动）
spring:
  datasource:
    url: jdbc:mysql://localhost:3306/campus_auth?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    driver-class-name: com.mysql.cj.jdbc.Driver
    username: root
    password: "改成你的MySQL密码"
  jpa:
    hibernate:
      ddl-auto: none
  sql:
    init:
      mode: always

# H2 控制台在 MySQL 模式下无意义，关闭
  h2:
    console:
      enabled: false
